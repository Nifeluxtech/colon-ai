---
# Nifelux · Colon AI — cPanel Git deployment ("Deploy HEAD Commit")
# Repo clone path: /home/apparatu/repositories/colon-ai
# API Node app root: repositories/colon-ai/services/api (runs in place)
deployment:
  tasks:
    - export HOMEDIR=/home/apparatu
    - export REPO=$HOMEDIR/repositories/colon-ai
    # Static web apps -> subdomain document roots
    - /bin/cp -R $REPO/apps/chat/public/. $HOMEDIR/chat.apparatus.name.ng/
    - /bin/cp -R $REPO/apps/browser/public/. $HOMEDIR/browser.apparatus.name.ng/
    - /bin/cp -R $REPO/apps/admin/public/. $HOMEDIR/admin.apparatus.name.ng/
    # Shared brand assets -> /brand on every app
    - /bin/mkdir -p $HOMEDIR/chat.apparatus.name.ng/brand $HOMEDIR/browser.apparatus.name.ng/brand $HOMEDIR/admin.apparatus.name.ng/brand
    - /bin/cp -R $REPO/packages/brand/assets/. $HOMEDIR/chat.apparatus.name.ng/brand/
    - /bin/cp -R $REPO/packages/brand/assets/. $HOMEDIR/browser.apparatus.name.ng/brand/
    - /bin/cp -R $REPO/packages/brand/assets/. $HOMEDIR/admin.apparatus.name.ng/brand/
    # Shared UI kit (design system + app core) -> /ui on every app
    - /bin/mkdir -p $HOMEDIR/chat.apparatus.name.ng/ui $HOMEDIR/browser.apparatus.name.ng/ui $HOMEDIR/admin.apparatus.name.ng/ui
    - /bin/cp -R $REPO/packages/ui/assets/. $HOMEDIR/chat.apparatus.name.ng/ui/
    - /bin/cp -R $REPO/packages/ui/assets/. $HOMEDIR/browser.apparatus.name.ng/ui/
    - /bin/cp -R $REPO/packages/ui/assets/. $HOMEDIR/admin.apparatus.name.ng/ui/
    # Restart hint for the API (also press Restart in Setup Node.js App)
    - /bin/mkdir -p $REPO/services/api/tmp
    - /bin/touch $REPO/services/api/tmp/restart.txt
