# One-time set-up of the Android release signing key, done entirely in GitHub (no PC). Run it by hand:
#   Actions > "Android signing key" > Run workflow.
# It creates a new keystore on the runner, stores it and its passwords straight into the four repository secrets
# the Android workflow reads (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD) and deletes it from the runner. Nothing secret is ever printed to the log.
# Needs one repository secret first: SECRETS_TOKEN, a fine-grained personal access token for this repository with
# "Secrets: Read and write" (GitHub's own token can't write secrets). Step by step: apps/android/README.md.
# Optional backup: tick "backup" and add the secret KEYSTORE_BACKUP_PASSPHRASE first; you get a passphrase-protected
# .7z artifact (opens in ZArchiver on Android) that is deleted after one day. Download it, then delete the artifact.
name: Android signing key

on:
  workflow_dispatch:
    inputs:
      mode:
        description: create = new key (refuses if one exists), backup = only export the existing key
        type: choice
        options: [create, backup]
        default: create
      replace:
        description: Type REPLACE to overwrite an existing key (phones with the old key must reinstall)
        type: string
        default: ''
      backup:
        description: Also produce an encrypted backup of the key (needs KEYSTORE_BACKUP_PASSPHRASE)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  key:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.SECRETS_TOKEN }}
      BACKUP_PASS: ${{ secrets.KEYSTORE_BACKUP_PASSPHRASE }}
      REPO: ${{ github.repository }}
    steps:
      - name: Check the set-up
        run: |
          if [ "${{ inputs.mode }}" = "create" ] && [ -z "$GH_TOKEN" ]; then
            echo "::error::Add the repository secret SECRETS_TOKEN first (see apps/android/README.md)."; exit 1
          fi
          WANT_BACKUP=${{ inputs.backup }}
          [ "${{ inputs.mode }}" = "backup" ] && WANT_BACKUP=true
          if [ "$WANT_BACKUP" = "true" ] && [ ${#BACKUP_PASS} -lt 16 ]; then
            echo "::error::A backup needs the secret KEYSTORE_BACKUP_PASSPHRASE (16 characters or more)."; exit 1
          fi

      - name: Refuse to replace a key by accident
        if: inputs.mode == 'create'
        run: |
          if gh secret list --repo "$REPO" | grep -q '^ANDROID_KEYSTORE_BASE64'; then
            if [ "${{ inputs.replace }}" != "REPLACE" ]; then
              echo "::error::A signing key already exists. Type REPLACE to overwrite it (installed apps can't update)."
              exit 1
            fi
            echo "::warning::Replacing the existing signing key."
          fi

      - name: Create the key and store it as secrets
        if: inputs.mode == 'create'
        run: |
          set -eu
          umask 077
          STORE_PW=$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | cut -c1-32)
          echo "::add-mask::$STORE_PW"
          export STORE_PW
          KS="$RUNNER_TEMP/colon-release.jks"
          # PKCS12 keystores use one password for the store and the key.
          keytool -genkeypair -storetype PKCS12 -keystore "$KS" -alias colon -keyalg RSA -keysize 4096 \
            -validity 10000 -dname "CN=Colon AI, O=Nifelux, C=NG" -storepass:env STORE_PW -keypass:env STORE_PW \
            > /dev/null 2>&1
          base64 -w0 "$KS" | gh secret set ANDROID_KEYSTORE_BASE64 --repo "$REPO"
          printf '%s' "$STORE_PW" | gh secret set ANDROID_KEYSTORE_PASSWORD --repo "$REPO"
          printf '%s' "$STORE_PW" | gh secret set ANDROID_KEY_PASSWORD --repo "$REPO"
          printf '%s' "colon" | gh secret set ANDROID_KEY_ALIAS --repo "$REPO"
          # Public certificate fingerprint (safe to show; needed later for App Links and Play).
          echo "Certificate SHA-256:"
          keytool -list -v -keystore "$KS" -storepass:env STORE_PW | grep -m1 'SHA256:' | sed 's/^[[:space:]]*//'
          if [ "${{ inputs.backup }}" = "true" ]; then
            mkdir -p "$RUNNER_TEMP/backup"
            cp "$KS" "$RUNNER_TEMP/backup/colon-release.jks"
            printf 'alias: colon\nstore password: %s\nkey password: %s\n' "$STORE_PW" "$STORE_PW" \
              > "$RUNNER_TEMP/backup/passwords.txt"
          fi
          shred -u "$KS"
          echo "Done: the four ANDROID_* secrets are set. Builds are now signed with this key."

      - name: Export the existing key for backup
        if: inputs.mode == 'backup'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          umask 077
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::There is no signing key to back up yet."; exit 1; fi
          mkdir -p "$RUNNER_TEMP/backup"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/backup/colon-release.jks"
          printf 'alias: %s\nstore password: %s\nkey password: %s\n' "$KEY_ALIAS" "$KEYSTORE_PASSWORD" \
            "$KEY_PASSWORD" > "$RUNNER_TEMP/backup/passwords.txt"

      - name: Encrypt the backup
        if: inputs.mode == 'backup' || inputs.backup
        run: |
          set -eu
          cd "$RUNNER_TEMP/backup"
          # AES-256 7z with encrypted file names; the passphrase is a secret, so it is masked if ever shown.
          7z a -t7z -mhe=on -p"$BACKUP_PASS" "$RUNNER_TEMP/colon-signing-key-backup.7z" colon-release.jks \
            passwords.txt > /dev/null
          shred -u colon-release.jks passwords.txt

      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'backup' || inputs.backup
        with:
          name: colon-signing-key-backup
          path: ${{ runner.temp }}/colon-signing-key-backup.7z
          retention-days: 1
