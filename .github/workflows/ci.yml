name: CI

on:
  push:
    branches: [main, restructure]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install API dependencies
        run: npm install --prefix services/api --no-audit --no-fund
      - name: Syntax check
        run: node scripts/check.js
      - name: Unit tests (UI modules + API model router and chat helpers)
        run: npm test
