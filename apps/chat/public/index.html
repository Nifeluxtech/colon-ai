<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07080c">
<title>Colon AI</title>
<link rel="stylesheet" href="/brand/colon-intro.css">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07080c;color:#f3f4f8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
  h1{font-size:2rem;letter-spacing:.06em;margin:.2em 0}
  p{color:#9aa3b2;margin:.4em 1.5em}
  .badge{display:inline-block;margin-top:1.2em;padding:.4em .9em;border:1px solid #2a2f3a;border-radius:999px;font-size:.85rem;color:#ff8a3d}
</style>
<script src="/brand/colon-intro.js" defer></script>
</head>
<body>
  <main>
    <h1>Colon AI</h1>
    <p>Colon Saga is coming. Built for Africa.</p>
    <span class="badge" id="api">Checking API…</span>
  </main>
  <script>
    fetch('https://api.apparatus.name.ng/health').then(r => r.json())
      .then(d => { document.getElementById('api').textContent = 'API ' + d.status + ' · ' + d.node; })
      .catch(() => { document.getElementById('api').textContent = 'API offline'; });
  </script>
</body>
</html>
