<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#080F24">
<meta name="color-scheme" content="dark light">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script>/* apply the saved theme before first paint */
try {
  var t = localStorage.getItem('colon.theme') || 'dark';
  if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
} catch (e) {}
</script>
<link rel="icon" href="/v0.6.5/packages/brand/assets/colon-mark.svg" type="image/svg+xml">
<link rel="preload" href="/v0.6.5/packages/ui/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/v0.6.5/packages/brand/css/colon-intro.css">
<link rel="stylesheet" href="/v0.6.5/packages/ui/css/tokens.css">
<link rel="stylesheet" href="/v0.6.5/packages/ui/css/base.css">
<link rel="stylesheet" href="/v0.6.5/packages/ui/css/components.css">
<link rel="stylesheet" href="/v0.6.5/packages/ui/css/content.css">
<link rel="stylesheet" href="/v0.6.5/packages/ui/css/browser.css">
<link rel="stylesheet" href="assets/css/chat-layout.css?v=0.6.5">
<link rel="stylesheet" href="assets/css/chat-composer.css?v=0.6.5">
<link rel="stylesheet" href="assets/css/chat-responsive.css?v=0.6.5">
<link rel="stylesheet" href="assets/css/chat-cbt.css?v=0.6.5">
<script src="/v0.6.5/packages/brand/js/colon-intro.js" defer></script>
<!-- Shared UI kit (packages/ui) and the Colon AI app (apps/chat/src), one versioned folder per release -->
<script type="module" src="/v0.6.5/apps/chat/src/main.js"></script>
<title>Colon AI</title>
<meta name="description"
  content="Colon AI by Nifelux: an AI assistant built for Africa, with Study, Developer and Research modes.">
</head>
<body>
<div id="app"></div>
<script>
/* Stale-cache guard (v0.3.1): if an old cached UI kit loaded, show a friendly refresh screen instead of a raw error.
   Since v0.5.4 every module loads from one versioned folder, so this mostly catches a module that failed to load. */
window.colonKitReady = function (need, extra) {
  var C = window.Colon, ok = !!(C && C.version && typeof C.start === 'function');
  if (ok) for (var i = 0; i < need.length; i++) if (typeof C[need[i]] !== 'function') { ok = false; break; }
  if (ok && extra) for (var j = 0; j < extra.length; j++) if (!window[extra[j]]) { ok = false; break; }
  if (ok) return true;
  var dark = document.documentElement.getAttribute('data-theme') !== 'light';
  document.getElementById('app').innerHTML = '<div role="alert" style="min-height:100dvh;display:grid;'
    + 'place-items:center;'
    + 'padding:24px;font:16px/1.5 Inter,system-ui,sans-serif;text-align:center;background:'
    + (dark ? '#080F24;color:#E2E8F0' : '#fff;color:#0F172A') + '">'
    + '<div style="max-width:360px">'
    + '<div style="font-size:20px;font-weight:700;margin-bottom:6px">Please refresh</div>'
    + '<p style="margin:0 0 18px;opacity:.75">' + document.title
    + ' was updated. Refresh to load the latest version.</p>'
    + '<button type="button" onclick="location.reload()" style="min-height:44px;padding:0 22px;border:0;'
    + 'border-radius:999px;background:#4169E1;color:#fff;font:600 15px Inter,system-ui,sans-serif;cursor:pointer">'
    + 'Refresh</button></div></div>';
  return false;
};
/* If the app's modules never ran (for example a file failed to load), show the same refresh screen. */
window.addEventListener('load', function () { if (!window.colonBooted) window.colonKitReady([], ['CW']); });
</script>
<noscript><p style="font:16px system-ui;padding:24px;color:#fff;background:#080F24">
Colon AI needs JavaScript turned on.</p></noscript>
</body>
</html>
