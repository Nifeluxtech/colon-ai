<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%23ff6a1a%22/%3E%3Cpath fill=%22%23fff%22 d=%22M12 4c2 2.6 3.7 4.5 3.7 7.3a3.7 3.7 0 0 1-7.4 0c0-1.3.5-2.4 1.3-3.4.2 1.1.7 1.8 1.5 2.2C11 8.1 11.3 6 12 4z%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="/brand/colon-intro.css?v=0.5.3">
<link rel="stylesheet" href="/ui/colon-ui.css?v=0.5.3">
<script src="/brand/colon-intro.js?v=0.5.3" defer></script>
<script src="/ui/colon-app.js?v=0.5.3" defer></script>
<link rel="stylesheet" href="css/admin.css?v=0.5.3">
<script src="js/admin-app.js?v=0.5.3" defer></script>
<title>Colon Admin</title>
<meta name="robots" content="noindex,nofollow">
</head>
<body>
<div id="app"></div>
<script>
/* Stale-cache guard (v0.3.1): if an old cached UI kit loaded, show a friendly refresh screen instead of a raw error. */
window.colonKitReady = function (need, extra) {
  var C = window.Colon, ok = !!(C && C.version && typeof C.start === 'function');
  if (ok) for (var i = 0; i < need.length; i++) if (typeof C[need[i]] !== 'function') { ok = false; break; }
  if (ok && extra) for (var j = 0; j < extra.length; j++) if (!window[extra[j]]) { ok = false; break; }
  if (ok) return true;
  var dark = document.documentElement.getAttribute('data-theme') !== 'light';
  document.getElementById('app').innerHTML = '<div role="alert" style="min-height:100dvh;display:grid;place-items:center;padding:24px;font:16px/1.5 Inter,system-ui,sans-serif;text-align:center;background:' + (dark ? '#080F24;color:#E2E8F0' : '#fff;color:#0F172A') + '">' +
    '<div style="max-width:360px"><div style="font-size:20px;font-weight:700;margin-bottom:6px">Please refresh</div>' +
    '<p style="margin:0 0 18px;opacity:.75">' + document.title + ' was updated. Refresh to load the latest version.</p>' +
    '<button type="button" onclick="location.reload()" style="min-height:44px;padding:0 22px;border:0;border-radius:999px;background:#4169E1;color:#fff;font:600 15px Inter,system-ui,sans-serif;cursor:pointer">Refresh</button></div></div>';
  return false;
};
</script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  if (!window.colonKitReady(['icon', 'esc', '$', '$$', 'api', 'toast', 'row', 'hasRole', 'roleName', 'sheet', 'confirm', 'prompt', 'field', 'bindForm', 'go'], ['ColonAdmin'])) return;
  window.ColonAdmin.start();
});
</script>
</body>
</html>
