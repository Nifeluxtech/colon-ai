<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#080F24">
<meta name="color-scheme" content="dark light">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script>/* apply the saved theme before first paint */try{var t=localStorage.getItem('colon.theme')||'dark';if(t==='system')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22%3E%3Crect width=%2248%22 height=%2248%22 rx=%2212%22 fill=%22%23080F24%22/%3E%3Cpath fill=%22%234169E1%22 d=%22M24 5c5 6 11 11 11 20a11 11 0 0 1-22 0c0-4 1.6-7.4 4.2-10.2.4 3.2 2 5.3 4.4 6.3C20.7 15 21.6 9.6 24 5z%22/%3E%3Cpath fill=%22%23FF9A3D%22 d=%22M24 20c2.3 3 5 5.3 5 9.2a5 5 0 0 1-10 0c0-1.9.7-3.4 2-4.6.2 1.4.9 2.4 2 2.8-.3-2.9.1-5.2 1-7.4z%22/%3E%3C/svg%3E">
<link rel="preload" href="/ui/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/brand/colon-intro.css">
<link rel="stylesheet" href="/ui/colon-ui.css">
<link rel="stylesheet" href="/ui/colon-browser.css">
<link rel="stylesheet" href="css/browser.css">
<script src="/brand/colon-intro.js" defer></script>
<!-- Shared UI kit (packages/ui → /ui/): the same browser module and session adapter Colon AI uses -->
<script src="/ui/colon-app.js" defer></script>
<script src="/ui/colon-store.js" defer></script>
<script src="/ui/colon-markdown.js" defer></script>
<script src="/ui/colon-url.js" defer></script>
<script src="/ui/colon-browser-data.js" defer></script>
<script src="/ui/colon-saga-browse.js" defer></script>
<script src="/ui/colon-browser.js" defer></script>
<script src="js/browser-app.js" defer></script>
<title>Colon Browser</title>
<meta name="description" content="Colon Browser by Nifelux: browse yourself, or let Colon Saga browse for you.">
</head>
<body>
<div id="app"></div>
<noscript><p style="font:16px system-ui;padding:24px;color:#fff;background:#080F24">Colon Browser needs JavaScript turned on.</p></noscript>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var C = window.Colon, CB = window.CB;
  function ws(path, title) { return { path: path, auth: true, bare: true, app: 'browser', title: title, render: CB.mount, update: CB.route }; }
  C.start({
    app: 'browser', title: 'Colon Browser', brand: 'COLON BROWSER', subtitle: 'by Nifelux',
    nav: [
      { href: '/', label: 'Browse', icon: 'compass' },
      { href: '/tabs', label: 'Tabs', icon: 'tabs' },
      { href: '/bookmarks', label: 'Bookmarks', icon: 'bookmark' },
      { href: '/account', label: 'Account', icon: 'user', match: /^\/account/ }
    ],
    routes: [ws('/', ''), ws('/tabs', 'Tabs'), ws('/bookmarks', 'Bookmarks'), ws('/history', 'History'), ws('/downloads', 'Downloads'), ws('/ai', 'AI Browse'), ws('/settings', 'Settings'), ws('/help', 'Help')]
  });
});
</script>
</body>
</html>
