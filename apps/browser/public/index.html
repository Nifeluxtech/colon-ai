<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%23ff6a1a%22/%3E%3Cpath fill=%22%23fff%22 d=%22M12 4c2 2.6 3.7 4.5 3.7 7.3a3.7 3.7 0 0 1-7.4 0c0-1.3.5-2.4 1.3-3.4.2 1.1.7 1.8 1.5 2.2C11 8.1 11.3 6 12 4z%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="/brand/colon-intro.css">
<link rel="stylesheet" href="/ui/colon-ui.css">
<script src="/brand/colon-intro.js" defer></script>
<script src="/ui/colon-app.js" defer></script>
<title>Colon Browser</title>
<meta name="description" content="Colon Browser by Nifelux: browse yourself, or let Colon Saga browse for you.">
</head>
<body>
<div id="app"></div>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var C = window.Colon, icon = C.icon, esc = C.esc;
  var QUICK = [['Google', 'https://www.google.com'], ['Wikipedia', 'https://www.wikipedia.org'], ['Punch', 'https://punchng.com'], ['Nairaland', 'https://www.nairaland.com'], ['Jumia', 'https://www.jumia.com.ng'], ['BBC Pidgin', 'https://www.bbc.com/pidgin']];

  function toUrl(q) {
    q = q.trim(); if (!q) return null;
    if (/^https?:\/\//i.test(q)) return q;
    if (/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(q)) return 'https://' + q;
    return 'https://www.google.com/search?q=' + encodeURIComponent(q);
  }

  function home(view) {
    view.innerHTML = C.verifyBanner() +
      '<section class="hero" style="padding-top:12px"><div class="orb" style="background:linear-gradient(135deg,#1b6fd1,#7cc4ff)">' + icon('compass') + '</div>' +
      '<h1 class="h1">Colon <span class="grad-text">Browser</span></h1><p class="lead">Browse yourself, or hand the wheel to Colon Saga.</p></section>' +
      '<form id="go" class="card" style="padding:8px;display:flex;gap:8px;border-radius:999px"><input class="input" style="border:0;background:transparent;min-height:46px" name="q" type="search" inputmode="url" placeholder="Search or type a web address" aria-label="Address" autocomplete="off">' +
      '<button class="btn primary" style="border-radius:999px;min-height:46px" aria-label="Go">' + icon('send') + '</button></form>' +
      '<div class="section-title">Quick links</div><div class="grid cols-4" style="grid-template-columns:repeat(3,1fr)">' + QUICK.map(function (q) {
        return '<a class="stat" style="text-align:center;padding:14px 8px" href="' + q[1] + '" target="_blank" rel="noopener"><span class="avatar" style="margin:0 auto 8px">' + esc(q[0][0]) + '</span><span style="color:var(--text);font-weight:600;font-size:13px">' + esc(q[0]) + '</span></a>'; }).join('') + '</div>' +
      '<div class="section-title">Control modes</div><div class="list">' +
      '<div class="row"><span class="ico">' + icon('user') + '</span><span class="body"><div class="title">Manual</div><div class="sub">You browse, Saga watches and helps</div></span><span class="badge">Phase 8</span></div>' +
      '<div class="row"><span class="ico">' + icon('sparkle') + '</span><span class="body"><div class="title">AI</div><div class="sub">Saga browses and reports back</div></span><span class="badge">Phase 9</span></div>' +
      '<div class="row"><span class="ico">' + icon('users') + '</span><span class="body"><div class="title">Shared</div><div class="sub">Take turns in the same tab</div></span><span class="badge">Phase 10</span></div></div>' +
      '<div class="banner" style="margin-top:16px;background:rgba(124,196,255,.08);border-color:rgba(124,196,255,.25);color:#cfe8ff">' + icon('phone') + '<span>The full browser runs in the Colon Android app. On the web, links open in a new tab for now.</span></div>';
    C.bindBanner(view);
    view.querySelector('#go').addEventListener('submit', function (e) {
      e.preventDefault(); var u = toUrl(e.target.q.value); if (u) window.open(u, '_blank', 'noopener');
    });
  }

  C.start({
    app: 'browser', title: 'Colon Browser', subtitle: 'Browser by Nifelux',
    nav: [
      { href: '/', label: 'Browse', icon: 'compass' },
      { href: '/account', label: 'Account', icon: 'user', match: /^\/account/ }
    ],
    routes: [{ path: '/', auth: true, render: home }]
  });
});
</script>
</body>
</html>
