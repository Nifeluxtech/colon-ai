<script>/* apply the saved theme before first paint */try{var t=localStorage.getItem('colon.theme')||'dark';if(t==='system')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>

<title>Colon Browser</title>
<meta name="description" content="Colon Browser by Nifelux: browse yourself, or let Colon Saga browse for you.">
</head>
<body>
<div id="app"></div>
<script>
/* Stale-cache guard (v0.3.1): if an old cached UI kit loaded, show a friendly refresh screen instead of a raw error. */
window.colonKitReady = function (need, extra) {
  var C = window.Colon, ok = !!(C && C.version && typeof C.start === 'function');
  if (ok) for (var i = 0; i < need.length; i++) if (typeof C[need[i]] !== 'function') { ok = false; break; }
  if (ok && extra) for (var j = 0; j < extra.length; j++) if (!window[extra[j]]) { ok = false; break; }
  if (ok) return true;
  var dark = document.documentElement.getAttribute('data-theme') !== 'light';
  document.getElementById('app').innerHTML = '<div role="alert" style="min-height:100dvh;display:grid;place-items:center;padding:24px;font:16px/1.5 Inter,system-ui,sans-serif;text-align:center;background:' + (dark ? '#080F24;color:#E2E8F0' : '#fff;color:#0F172A') + '">' +
    '<div style="max-width:360px"><div style="font-size:20px;font-weight:700;margin-bottom:6px">Please refresh</div>' +
    '<p style="margin:0 0 18px;opacity:.75">' + document.title + ' was updated. Refresh to load the latest version.</p>' +
    '<button type="button" onclick="location.reload()" style="min-height:44px;padding:0 22px;border:0;border-radius:999px;background:#4169E1;color:#fff;font:600 15px Inter,system-ui,sans-serif;cursor:pointer">Refresh</button></div></div>';
  return false;
};
</script>
<noscript><p style="font:16px system-ui;padding:24px;color:#fff;background:#080F24">Colon Browser needs JavaScript turned on.</p></noscript>
<script>
document.addEventListener('DOMContentLoaded', function () {
  if (!window.colonKitReady(['icon', 'esc', 'sheet', 'menu', 'confirm', 'prompt', 'toast', 'debounce', 'logo', 'uid', 'copyText', 'fmtBytes', 'ago'], ['CB', 'ColonBrowser', 'ColonBrowserData', 'ColonURL']) || typeof window.CB.mount !== 'function') return;
  var C = window.Colon, CB = window.CB;
  function ws(path, title) { return { path: path, auth: true, bare: true, app: 'browser', title: title, render: CB.mount, update: CB.route }; }
  C.start({
    app: 'browser', title: 'Colon Browser', brand: 'COLON BROWSER', subtitle: 'by Nifelux', tabbar: false,
    nav: [
      { href: '/', label: 'Browse', icon: 'compass' },
      { href: '/tabs', label: 'Tabs', icon: 'tabs' },
      { href: '/bookmarks', label: 'Bookmarks', icon: 'bookmark' },
      { href: '/account', label: 'Account', icon: 'user', match: /^\/account/ }
    ],
    routes: [ws('/', ''), ws('/tabs', 'Tabs'), ws('/bookmarks', 'Bookmarks'), ws('/history', 'History'), ws('/downloads', 'Downloads'), ws('/ai', 'AI Browse'), ws('/settings', 'Settings'), ws('/help', 'Help')]
  });
});
</script>
</body>
</html>
