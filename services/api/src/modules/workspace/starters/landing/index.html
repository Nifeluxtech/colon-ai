<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="hero">
    <span class="pill">Launching soon</span>
    <h1>{{TITLE}}</h1>
    <p>One clear sentence about what you're launching and the problem it solves.</p>
    <form class="join" id="join">
      <input type="email" placeholder="you@example.com" required aria-label="Email">
      <button type="submit">Join the waitlist</button>
    </form>
    <p id="ok" class="ok" hidden>You're on the list. We'll be in touch.</p>
  </main>
  <section class="features">
    <div><h3>Fast</h3><p>A benefit people care about.</p></div>
    <div><h3>Simple</h3><p>Another reason to sign up.</p></div>
    <div><h3>Affordable</h3><p>One more good reason.</p></div>
  </section>
  <footer>© <span id="y"></span> {{TITLE}}</footer>
  <script src="script.js"></script>
</body>
</html>
